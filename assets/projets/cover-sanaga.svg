<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Sanaga : 11 200 combats simules, 8 unites toutes entre 45 et 55 pour cent de victoires">
  <defs>
    <linearGradient id="gSan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.0" stop-color="#0F1416"/>
      <stop offset="0.55" stop-color="#1D3033"/>
      <stop offset="1.0" stop-color="#2A4A45"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#gSan)"/>
  <g opacity="0.3" stroke="#4FA3A3" stroke-width="1.5" fill="none">
    <path d="M0 60 H640 M0 300 H640"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" text-anchor="middle">
    <text x="320" y="40" fill="#BFE3E0" font-size="15" letter-spacing="3">SANAGA — AUTO-BATTLER</text>

    <!-- Les deux camps, comme sur le plateau du jeu. -->
    <g>
      <circle cx="96"  cy="104" r="17" fill="#4FA3A3"/><text x="96"  y="110" font-size="12" fill="#10201F" font-weight="700">LA</text>
      <circle cx="140" cy="140" r="17" fill="#4FA3A3"/><text x="140" y="146" font-size="12" fill="#10201F" font-weight="700">AR</text>
      <circle cx="96"  cy="176" r="17" fill="#4FA3A3"/><text x="96"  y="182" font-size="12" fill="#10201F" font-weight="700">BO</text>
      <circle cx="544" cy="104" r="17" fill="#C8663A"/><text x="544" y="110" font-size="12" fill="#160D08" font-weight="700">SO</text>
      <circle cx="500" cy="140" r="17" fill="#C8663A"/><text x="500" y="146" font-size="12" fill="#160D08" font-weight="700">CO</text>
      <circle cx="544" cy="176" r="17" fill="#C8663A"/><text x="544" y="182" font-size="12" fill="#160D08" font-weight="700">AS</text>
    </g>

    <!-- La these : les valeurs sont mesurees, pas supposees. -->
    <rect x="196" y="88" width="248" height="52" rx="10" fill="#0B1112" stroke="#4A5A55" stroke-width="1.5"/>
    <text x="320" y="110" fill="#ECE7DC" font-size="13">equilibrage.json</text>
    <text x="320" y="128" fill="#A8AFA6" font-size="11">source unique des valeurs</text>

    <g stroke="#E0A93C" stroke-width="2" fill="none">
      <path d="M320 144 V166"/><path d="M314 158 L320 166 L326 158"/>
    </g>

    <rect x="196" y="172" width="248" height="46" rx="10" fill="#0B1112" stroke="#E0A93C" stroke-width="2"/>
    <text x="320" y="190" fill="#ECE7DC" font-size="13">check-equilibrage.js</text>
    <text x="320" y="208" fill="#E0A93C" font-size="11">refuse la fusion si hors 45-55 %</text>

    <rect x="52" y="240" width="536" height="76" rx="14" fill="#080D0E" stroke="#4FA3A3" stroke-width="2"/>
    <text x="145" y="280" fill="#ECE7DC" font-size="34" font-weight="700">11 200</text>
    <text x="145" y="300" fill="#A8AFA6" font-size="11">combats simules</text>
    <text x="240" y="278" fill="#3A4A48" font-size="24">·</text>
    <text x="320" y="280" fill="#ECE7DC" font-size="34" font-weight="700">8/8</text>
    <text x="320" y="300" fill="#A8AFA6" font-size="11">unites dans la fourchette</text>
    <text x="400" y="278" fill="#3A4A48" font-size="24">·</text>
    <text x="492" y="280" fill="#6BBF6B" font-size="34" font-weight="700">3,8</text>
    <text x="492" y="300" fill="#D8FFE6" font-size="11">pts d'amplitude max</text>
  </g>
</svg>
