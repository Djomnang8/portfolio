<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Atelier de marque : un symbole construit sur deux cercles, rapport racine de 3, 13 variantes et 206 controles">
  <defs>
    <linearGradient id="gMarque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.0" stop-color="#231610"/>
      <stop offset="0.55" stop-color="#3B2418"/>
      <stop offset="1.0" stop-color="#6B3A12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#gMarque)"/>
  <g opacity="0.26" stroke="#C86A10" stroke-width="1.5" fill="none">
    <path d="M0 56 H640 M0 304 H640"/>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace" text-anchor="middle">
    <text x="320" y="36" fill="#F0D8CC" font-size="15" letter-spacing="3">ATELIER DE MARQUE — DIBAMBA</text>
  </g>

  <!-- La construction, montree telle qu'elle est dans la charte. -->
  <g transform="translate(60 60)">
    <g stroke="#C9B8A8" stroke-width="1.6" fill="none" stroke-dasharray="9 6" opacity="0.9">
      <circle cx="45.5" cy="78" r="65"/>
      <circle cx="110.5" cy="78" r="65"/>
    </g>
    <g transform="scale(1.3)">
      <path d="M 60 16.699 A 50 50 0 0 1 60 103.301 A 50 50 0 0 1 60 16.699 Z" fill="#F8F2E7"/>
      <path d="M 60 22.761 C 46 48.742, 74 71.258, 60 97.239" fill="none" stroke="#C86A10" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g fill="#A79E90">
      <circle cx="45.5" cy="78" r="2.2"/><circle cx="110.5" cy="78" r="2.2"/>
    </g>
  </g>

  <g font-family="'JetBrains Mono',ui-monospace,monospace">
    <text x="286" y="106" fill="#F0EBE2" font-size="15">R = 50</text>
    <text x="376" y="106" fill="#F0EBE2" font-size="15">d = 50</text>
    <text x="286" y="130" fill="#C9B8A8" font-size="12">deux cercles, une intersection</text>
    <text x="286" y="168" fill="#C86A10" font-size="26" font-weight="700">rapport = racine(3)</text>
    <text x="286" y="190" fill="#C9B8A8" font-size="12">consequence de la geometrie, pas un reglage</text>

    <rect x="286" y="212" width="300" height="66" rx="12" fill="#150E09" stroke="#C86A10" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="336" y="248" fill="#ECE4DC" font-size="27" font-weight="700">13</text>
      <text x="336" y="266" fill="#C9B8A8" font-size="10">variantes</text>
      <text x="436" y="248" fill="#ECE4DC" font-size="27" font-weight="700">6</text>
      <text x="436" y="266" fill="#C9B8A8" font-size="10">applications</text>
      <text x="536" y="248" fill="#5FBF8B" font-size="27" font-weight="700">206</text>
      <text x="536" y="266" fill="#D8FFE6" font-size="10">controles verts</text>
    </g>

    <text x="286" y="300" fill="#E5D6C8" font-size="11">tokens.json  -&gt;  logo · pictogrammes · motifs · applications</text>
  </g>
