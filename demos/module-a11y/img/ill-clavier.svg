    .s{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
    text{font-family:Segoe UI,system-ui,sans-serif;font-weight:700}
  </style>

  <rect width="420" height="300" rx="18" fill="var(--bg,#F1F5FB)"/>
  <rect x="26" y="126" width="76" height="48" rx="10" fill="var(--card,#FFFFFF)" stroke="var(--ink,#16213E)" class="s"/>
  <text x="64" y="152" text-anchor="middle" font-size="16" fill="var(--ink,#16213E)">Tab</text>
  <path d="M46 163h30M66 158l6 5-6 5" stroke="var(--soft,#4A5673)" class="s"/>

  <path d="M110 150h34" stroke="var(--pri,#1D4ED8)" stroke-dasharray="5 6" class="s"/>
  <path d="M138 144l7 6-7 6" stroke="var(--pri,#1D4ED8)" class="s"/>

  <rect x="152" y="52" width="238" height="44" rx="9" fill="var(--card,#FFFFFF)" stroke="var(--line,#78859F)" class="s"/>
  <rect x="176" y="68" width="86" height="8" rx="4" fill="var(--pale,#C3CEE3)"/>
  <circle cx="152" cy="52" r="14" fill="var(--pri,#1D4ED8)"/>
  <text x="152" y="57" text-anchor="middle" font-size="13" fill="var(--card,#FFFFFF)">1</text>

  <rect x="152" y="128" width="238" height="44" rx="9" fill="var(--card,#FFFFFF)" stroke="var(--line,#78859F)" class="s"/>
  <rect x="176" y="144" width="120" height="8" rx="4" fill="var(--pale,#C3CEE3)"/>
  <circle cx="152" cy="128" r="14" fill="var(--pri,#1D4ED8)"/>
  <text x="152" y="133" text-anchor="middle" font-size="13" fill="var(--card,#FFFFFF)">2</text>

  <rect x="152" y="204" width="118" height="44" rx="9" fill="var(--pri,#1D4ED8)"/>
  <rect x="176" y="222" width="70" height="8" rx="4" fill="var(--card,#FFFFFF)"/>
  <circle cx="152" cy="204" r="14" fill="var(--acc,#B03A0B)"/>
  <text x="152" y="209" text-anchor="middle" font-size="13" fill="var(--card,#FFFFFF)">3</text>
  <rect x="144" y="196" width="134" height="60" rx="13" stroke="var(--acc,#B03A0B)" stroke-width="3" fill="none"/>

  <rect x="292" y="204" width="98" height="44" rx="9" fill="var(--card,#FFFFFF)" stroke="var(--ko,#A81E1E)" stroke-dasharray="5 5" class="s"/>
  <path d="M333 218l14 14M347 218l-14 14" stroke="var(--ko,#A81E1E)" class="s"/>
  <text x="341" y="270" text-anchor="middle" font-size="11" font-weight="400" fill="var(--ko,#A81E1E)">jamais atteint</text>

  <path d="M271 96v20M271 172v20" stroke="var(--pri,#1D4ED8)" stroke-dasharray="5 6" class="s"/>
