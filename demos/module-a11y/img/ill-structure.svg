<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Arborescence de titres de niveau 1, 2 et 3">
  <style>
    :root{--bg:#F1F5FB;--ink:#16213E;--soft:#4A5673;--pri:#1D4ED8;--acc:#B03A0B;--ok:#146C39;--ko:#A81E1E;--card:#FFFFFF;--line:#78859F;--pale:#C3CEE3}
    @media (prefers-color-scheme: dark){:root{--bg:#1B2436;--ink:#EAF0FA;--soft:#AEBBD4;--pri:#8FB4FF;--acc:#FFAD7A;--ok:#7BD9A2;--ko:#FF9A9A;--card:#111827;--line:#68779A;--pale:#3C4A63}}
    .s{stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
    text{font-family:Segoe UI,system-ui,sans-serif;font-weight:700}
  </style>

  <rect width="420" height="300" rx="18" fill="var(--bg,#F1F5FB)"/>

  <rect x="34" y="42" width="230" height="34" rx="8" fill="var(--pri,#1D4ED8)"/>
  <text x="52" y="64" font-size="14" fill="var(--card,#FFFFFF)">H1 · Titre du support</text>

  <path d="M50 76v34M50 110h22" stroke="var(--line,#78859F)" class="s"/>
  <rect x="76" y="94" width="196" height="30" rx="8" fill="var(--card,#FFFFFF)" stroke="var(--pri,#1D4ED8)" class="s"/>
  <text x="94" y="114" font-size="13" fill="var(--ink,#16213E)">H2 · Première partie</text>

  <path d="M92 124v30M92 154h22M92 154v40M92 194h22" stroke="var(--line,#78859F)" class="s"/>
  <rect x="118" y="140" width="172" height="28" rx="8" fill="var(--card,#FFFFFF)" stroke="var(--line,#78859F)" class="s"/>
  <text x="136" y="159" font-size="12" font-weight="400" fill="var(--soft,#4A5673)">H3 · Sous-section</text>
  <rect x="118" y="180" width="172" height="28" rx="8" fill="var(--card,#FFFFFF)" stroke="var(--line,#78859F)" class="s"/>
  <text x="136" y="199" font-size="12" font-weight="400" fill="var(--soft,#4A5673)">H3 · Sous-section</text>

  <path d="M50 110v122M50 232h22" stroke="var(--line,#78859F)" class="s"/>
  <rect x="76" y="218" width="196" height="30" rx="8" fill="var(--card,#FFFFFF)" stroke="var(--pri,#1D4ED8)" class="s"/>
  <text x="94" y="238" font-size="13" fill="var(--ink,#16213E)">H2 · Seconde partie</text>

  <path d="M316 60v180" stroke="var(--acc,#B03A0B)" stroke-dasharray="4 6" class="s"/>
  <path d="M316 60h-10M316 240h-10" stroke="var(--acc,#B03A0B)" class="s"/>
  <text x="330" y="132" font-size="11" font-weight="400" fill="var(--acc,#B03A0B)">le plan annoncé</text>
  <text x="330" y="148" font-size="11" font-weight="400" fill="var(--acc,#B03A0B)">par le lecteur</text>
  <text x="330" y="164" font-size="11" font-weight="400" fill="var(--acc,#B03A0B)">d’écran</text>
</svg>
