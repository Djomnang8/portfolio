  <text x="210" y="42" text-anchor="middle" font-size="17" fill="var(--ink,#16213E)">Un seul contenu</text>
  <text x="210" y="63" text-anchor="middle" font-size="13" font-weight="400" fill="var(--soft,#4A5673)">quatre façons de le recevoir</text>
</svg>
